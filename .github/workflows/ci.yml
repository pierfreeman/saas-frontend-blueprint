name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── Job 1: Lint · Typecheck · Build · Unit Tests ────────────────────────────
  unit:
    name: Lint · Typecheck · Build · Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          filter: tree:0
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - run: npm ci

      - name: Restore NX cache
        uses: actions/cache@v4
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            nx-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
            nx-${{ runner.os }}-

      - name: Format check
        run: npx nx format:check --base=remotes/origin/main

      - name: Lint
        run: npx nx run-many -t lint --nx-bail

      - name: Typecheck
        run: npx nx run-many -t typecheck --nx-bail

      - name: Build
        run: npx nx run-many -t build --nx-bail

      - name: Unit Tests
        run: npx nx run-many -t test --coverage --nx-bail

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-unit
          path: coverage/
          retention-days: 1

      - run: npx nx fix-ci
        if: always()

  # ── Job 2: SonarQube Analysis ──────────────────────────────────────────────
  # Runs after unit passes. Downloads coverage artifacts and sends a full
  # static-analysis + coverage report to SonarCloud.
  # Required secrets: SONAR_TOKEN, SONAR_HOST_URL
  sonarqube:
    name: SonarQube Analysis
    runs-on: ubuntu-latest
    needs: unit

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Disable shallow clone for accurate blame and new-code detection
          fetch-depth: 0

      - name: Download unit coverage reports
        uses: actions/download-artifact@v4
        with:
          name: coverage-unit
          path: coverage/

      # No path-rewrite needed: sonarqube-scan-action@v6 runs the scanner
      # natively on the runner (not inside Docker). $GITHUB_WORKSPACE is
      # identical in both the unit job and this job, so the absolute SF:
      # paths in the lcov files already match the source tree here.

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
