name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  pull-requests: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── Job 1: Lint · Typecheck · Unit Tests ────────────────────────────────────
  unit:
    name: Lint · Typecheck · Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          filter: tree:0
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - run: npm ci

      - name: Restore NX cache
        uses: actions/cache@v4
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            nx-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
            nx-${{ runner.os }}-

      # - name: Format check
      #   run: npx nx format:check --base=remotes/origin/main

      - name: Lint
        run: npx nx run-many -t lint --nx-bail

      - name: Typecheck
        run: npx nx run-many -t typecheck --nx-bail

      - name: Unit Tests
        run: npx nx run-many -t test --coverage --nx-bail

      - name: Coverage summary
        if: always()
        run: node scripts/coverage-summary.mjs >> "$GITHUB_STEP_SUMMARY"

      - name: Comment coverage on PR
        if: always() && github.event_name == 'pull_request'
        run: node scripts/coverage-summary.mjs > coverage-comment.md

      - name: Post coverage PR comment
        if: always() && github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: coverage
          path: coverage-comment.md

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-unit
          path: coverage/
          retention-days: 1

      - run: npx nx fix-ci
        if: always()

  # ── Job 2: SonarQube Analysis ──────────────────────────────────────────────
  # Runs after unit passes. Downloads coverage artifacts and sends a full
  # static-analysis + coverage report to SonarCloud.
  # Required secrets: SONAR_TOKEN, SONAR_HOST_URL
  sonarqube:
    name: SonarQube Analysis
    runs-on: ubuntu-latest
    needs: unit

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Disable shallow clone for accurate blame and new-code detection
          fetch-depth: 0

      - name: Download unit coverage reports
        uses: actions/download-artifact@v4
        with:
          name: coverage-unit
          path: coverage/

      # No path-rewrite needed: sonarqube-scan-action@v6 runs the scanner
      # natively on the runner (not inside Docker). $GITHUB_WORKSPACE is
      # identical in both the unit job and this job, so the absolute SF:
      # paths in the lcov files already match the source tree here.

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  # ── Job 3: Deploy to Vercel ────────────────────────────────────────────────
  # Runs only after unit tests AND SonarQube pass.
  # Uses Vercel CLI to trigger deploys. Each Vercel project uses nx-ignore
  # to skip unaffected apps.
  #
  # Required secrets:
  #   VERCEL_TOKEN  — Vercel personal/team token
  #   VERCEL_ORG_ID — Vercel team/org ID
  #   VERCEL_PROJECT_ID_SHELL    — Vercel project ID for shell
  #   VERCEL_PROJECT_ID_AUTH     — Vercel project ID for auth
  #   VERCEL_PROJECT_ID_PLATFORM — Vercel project ID for platform
  #   VERCEL_PROJECT_ID_ADMIN    — Vercel project ID for admin
  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    needs: [unit, sonarqube]
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        app:
          - name: shell
            project_id_secret: VERCEL_PROJECT_ID_SHELL
          - name: auth
            project_id_secret: VERCEL_PROJECT_ID_AUTH
          - name: platform
            project_id_secret: VERCEL_PROJECT_ID_PLATFORM
          - name: admin
            project_id_secret: VERCEL_PROJECT_ID_ADMIN

    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}

    steps:
      - uses: actions/checkout@v4
        with:
          filter: tree:0
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - run: npm ci

      - name: Install Vercel CLI
        run: npm i -g vercel@latest

      - name: Check if app is affected
        id: affected
        run: |
          if npx nx-ignore ${{ matrix.app.name }}; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Pull Vercel environment
        if: steps.affected.outputs.skip == 'false'
        run: vercel pull --yes --token=$VERCEL_TOKEN
        env:
          VERCEL_PROJECT_ID: ${{ secrets[matrix.app.project_id_secret] }}

      # Production: push to main
      - name: Deploy to production
        if: steps.affected.outputs.skip == 'false' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: vercel deploy --prod --token=$VERCEL_TOKEN
        env:
          VERCEL_PROJECT_ID: ${{ secrets[matrix.app.project_id_secret] }}

      # Staging: push to develop
      - name: Deploy to staging
        if: steps.affected.outputs.skip == 'false' && github.event_name == 'push' && github.ref == 'refs/heads/develop'
        run: vercel deploy --token=$VERCEL_TOKEN
        env:
          VERCEL_PROJECT_ID: ${{ secrets[matrix.app.project_id_secret] }}

      # Preview: pull requests targeting main or develop
      - name: Deploy preview
        if: steps.affected.outputs.skip == 'false' && github.event_name == 'pull_request'
        id: preview
        run: |
          url=$(vercel deploy --token=$VERCEL_TOKEN)
          echo "url=$url" >> "$GITHUB_OUTPUT"
        env:
          VERCEL_PROJECT_ID: ${{ secrets[matrix.app.project_id_secret] }}

      - name: Comment preview URL on PR
        if: steps.preview.outputs.url
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: preview-${{ matrix.app.name }}
          message: |
            🚀 **${{ matrix.app.name }}** preview deployed: ${{ steps.preview.outputs.url }}
